# Pings both Render free-tier services every 9 minutes so they never hit the
# 15-minute idle threshold that puts them to sleep. Free to run here: this repo
# is public, so GitHub Actions minutes are unmetered — no cron-job.org/UptimeRobot
# account needed. Does NOT solve Render's separate ephemeral-storage problem (see
# render.yaml and the README's "Deploying to Render" section) — this only stops
# the free tier from idling out, it doesn't make disk or the WhatsApp session
# persistent across restarts.
name: Keep Render services awake

on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch: {} # lets you trigger a one-off ping manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping credora-agent /health
        run: curl -fsS --max-time 20 https://credora-agent.onrender.com/health || echo "credora-agent ping failed (service may be cold-starting)"

      - name: Ping credora-dashboard
        run: curl -fsS --max-time 20 https://credora-dashboard.onrender.com/dashboard.html > /dev/null || echo "credora-dashboard ping failed (service may be cold-starting)"
