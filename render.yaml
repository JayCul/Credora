# Render Blueprint — deploy both services at once via Render's "Blueprint" option
# (New > Blueprint, point it at this repo). Free tier for both.
#
# IMPORTANT, read before relying on this: Render's free tier has no persistent
# storage of any kind, disk or Key Value are both wiped on every restart, not just
# on deploys. That means auth_info_baileys/ (the WhatsApp session) and data/ (local
# business names, item descriptions, expenses) do not survive a restart. On-chain
# sales data is unaffected either way, it lives on BOT Chain, not on Render.
#
# ALSO: these are two separate services with two separate filesystems, so data/ on
# one is invisible to the other even while both are running, not just across a
# restart. The dashboard's business names and per-merchant receipt list (item,
# buyer name, PDF) will stay blank here, since only the agent ever writes to its
# own data/. Tier, credit score, streak, volume, and confirmedCount are unaffected,
# those come straight from on-chain events read client-side, no local store
# involved. See the README's "Deploying to Render" section for the full breakdown,
# and .github/workflows/keep-alive.yml for what stops the free tier idling out.

services:
  - type: web
    name: credora-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node agent/whatsapp.js
    healthCheckPath: /health
    envVars:
      - key: NETWORK
        value: mainnet
      - key: BOTCHAIN_RPC_URL
        sync: false
      - key: BOTCHAIN_TESTNET_RPC_URL
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PHONE_HASH_SALT
        sync: false
      - key: DASHBOARD_BASE_URL
        sync: false
      # Digits only, country code, no leading + (e.g. 2348012345678). Optional, but
      # worth setting on a hosted log viewer: without it, linking falls back to an
      # ASCII QR code printed to logs, and most log viewers timestamp every line
      # separately, which breaks the QR's grid the moment it's copied or reflowed.
      # Set this and agent/whatsapp.js prints a short pairing code instead, entered
      # under WhatsApp → Linked Devices → Link with phone number.
      - key: WHATSAPP_PHONE_NUMBER
        sync: false

  - type: web
    name: credora-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    # Not /api/config on purpose — that returns 503 until a contract is deployed on
    # whichever network NETWORK points at, which would make Render think a perfectly
    # healthy dashboard is down before you've ever deployed anything to check.
    healthCheckPath: /dashboard.html
    envVars:
      - key: NETWORK
        value: mainnet
      - key: BOTCHAIN_RPC_URL
        sync: false
      - key: BOTCHAIN_TESTNET_RPC_URL
        sync: false
